<!DOCTYPE html>
<html lang="fr">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Page d'accueil</title>
        <link rel="stylesheet" href="css/formulaire_connexion.css">
    </head>
<body>
    <header>
        <div class="contenu_header">
            <div class="logo">
                <a href="https://www.capcomfrance.fr/"><img src="img/capcom.png" alt="Logo Capcom"></a>
            </div>
            <nav>
                <ul>
                    <li><a href="index_connexion.html">Accueil</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main>
        <div class="form-container">
            <h2>Connexion</h2>
            
            <form action="index.html" method="get">
                <fieldset>
                    <label for="email">Adresse email</label>
                    <input type="email" id="email" name="email" placeholder="email@exemple.com" 
                    oninvalid="this.setCustomValidity('Veuillez entrer un email valide.')" 
                    oninput="this.setCustomValidity('')" 
                    required title="Veuillez entrer un email.">
                    <ul></ul>

                    <label for="mdp">Mot de passe</label>
                    <input type="text" id="password" name="password" placeholder="Votre mot de passe" 
                    oninvalid="this.setCustomValidity('Veuillez entrer votre mot de passe.')" 
                    oninput="this.setCustomValidity('')" 
                    required title="Veuillez entrer votre mot de passe.">
                    <ul></ul>
                </fieldset>
                <div class="form-buttons">
                    <input type="reset" value="Effacer">
                    <input type="submit" value="Se connecter">
                </div>
            </form>
        </div>
    </main>

    <footer>
        <p>&copy; 2025 Capcom | <a href="https://www.capcomfrance.fr/">Site Officiel</a> | Suivez-nous sur : 
            <a href="https://x.com/capcom_france/">Twitter</a> | 
            <a href="https://www.facebook.com/CapcomFrance/">Facebook</a> | 
            <a href="https://www.instagram.com/Capcomfr/?hl=fr">Instagram</a>
        </p>
    </footer>
</body>
</html>
