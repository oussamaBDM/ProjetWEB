<!DOCTYPE html>
<html lang="fr">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Recherche de location</title>
        <link rel="stylesheet" type="text/css" href="css/formulaireL.css" />
    </head>
<body>
    <header>
        <div class="contenu_header">
            <div class="logo">
                <a href="https://www.capcomfrance.fr/"><img src="img/capcom.png" alt="Logo Capcom"></a>
            </div>
            <nav>
                <ul>
                    <li><a href="index.html">Accueil</a></li>
                    <li><a href="administration.html">Administration</a></li>
                    <li><a href="compte.html">Compte</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main>
        <div class="form-container">
            <h2>Trouvez une location !</h2>
            <p>Remplissez ce formulaire pour trouver la location qui vous correspondra.</p>
            
            <form action="rechercheL.html" method="get">
                <fieldset>
                    <legend>Informations Personnelles</legend>

                    <label for="nom">Nom
                    </label>
                    <input type="text" id="nom" name="nom" placeholder="Votre nom"
                    oninvalid="this.setCustomValidity('Veuillez entrer votre nom.')" 
                    oninput="this.setCustomValidity('')" 
                    required title="Veuillez entrer votre nom.">
                    <ul></ul>

                    <label for="prenom">Prénom</label>
                    <input type="text" id="prenom" name="prenom" placeholder="Votre prénom"
                    oninvalid="this.setCustomValidity('Veuillez entrer votre prénom.')" 
                    oninput="this.setCustomValidity('')" 
                    required title="Veuillez entrer votre prénom.">
                    <ul></ul>

                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" placeholder="email@exemple.com"
                    oninvalid="this.setCustomValidity('Veuillez entrer un email valide.')" 
                    oninput="this.setCustomValidity('')" 
                    required title="Veuillez entrer votre email.">
                    <ul></ul>

                    <label for="telephone">Téléphone</label>
                    <input type="tel" id="telephone" name="telephone" pattern="[0-9]{10}" maxlength="10" placeholder="06 xx xx xx xx"
                    oninvalid="this.setCustomValidity('Veuillez entrer un numéro de téléphone valide.')" 
                    oninput="this.setCustomValidity('')" 
                    required title="Veuillez entrer votre numéro de téléphone.">
                    <ul></ul>
                </fieldset>

                <fieldset>
                    <legend>Vos horaires</legend>

                    <label for="typeV">Type de véhicule</label>
                    <select name="typeV" id="typeV"
                    oninvalid="this.setCustomValidity('Veuillez choisir un type de véhicule.')" 
                    oninput="this.setCustomValidity('')" 
                    required title="Veuillez choisir un type de véhicule.">
                        <option value="">choisissez le type de véhicule dont vous avez besoin</option>
                        <option value="v-5">Voiture -5 places</option>
                        <option value="v5">Voiture 5 places</option>
                        <option value="v+5">Voiture +5 places</option>
                        <option value="AM">Moto permis AM</option>
                        <option value="A1">Moto permis A1</option>
                        <option value="A2">Moto permis A2</option>
                        <option value="A">Moto permis A</option>
                        <option value="c">Camionnette</option>
                        <option value="f">Fourgon</option>
                        <option value="C">Camion</option>
                    </select>
                    <ul></ul>

                    <label for="dateR">Date et Heure de récupération</label>
                    <input type="datetime-local" id="dateR" name="dateR" value="" min="2025-01-01T08:00" max="2100-01-01T18:00"
                    oninvalid="this.setCustomValidity('Veuillez entrer une date et un horaire valide.')" 
                    oninput="this.setCustomValidity('')" 
                    required title="Veuillez entrer une date et un horaire.">
                    <ul></ul>

                    <label for="ville">Ville</label>
                    <input type="text" id="ville" name="ville" placeholder="Ville de récupération"
                    oninvalid="this.setCustomValidity('Veuillez entrer une ville.')" 
                    oninput="this.setCustomValidity('')" 
                    required title="Veuillez entrer une ville.">
                    <ul></ul>

                    <label for="dateD">Date et Heure de dépôt</label>
                    <input type="datetime-local" id="dateD" name="dateD" min="2025-01-01T08:00" max="2100-01-01T18:00"
                    oninvalid="this.setCustomValidity('Veuillez entrer une date et un horaire valide.')" 
                    oninput="this.setCustomValidity('')" 
                    required title="Veuillez entrer une date et un horaire.">
                    <ul></ul>
                </fieldset>

                <div class="form-buttons">
                    <input type="reset" value="Effacer">
                    <input type="submit" value="Rechercher">
                </div>
            </form>
        </div>
    </main>

    <footer>
        <p>&copy; 2025 Capcom | <a href="https://www.capcomfrance.fr/">Site Officiel</a> | Suivez-nous sur : 
            <a href="https://x.com/capcom_france/">Twitter</a> | 
            <a href="https://www.facebook.com/CapcomFrance/">Facebook</a> | 
            <a href="https://www.instagram.com/Capcomfr/?hl=fr">Instagram</a>
        </p>
    </footer>
</body>
</html>
